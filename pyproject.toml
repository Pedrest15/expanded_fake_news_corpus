[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fakegen-br"
version = "0.1.0"
description = "Geração de corpus de fake news em português brasileiro com LLMs (FakeGen.BR)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "langgraphlib",
    "python-dotenv>=1.0",
    # Provedores suportados pelo projeto
    "langchain-openai>=1.1.6",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langchain-groq>=1.1.3",
]

[project.scripts]
fakegen = "expanded_fake_news_corpus.cli:main"
fakegen-analysis = "expanded_fake_news_corpus.analysis.runner:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
# Caracterização lexical/sintática do corpus (src/expanded_fake_news_corpus/analysis)
analysis = [
    "matplotlib>=3.9",
    "nltk>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[tool.uv.sources]
langgraphlib = { git = "https://github.com/Pedrest15/LangGraphLib.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/expanded_fake_news_corpus"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["expanded_fake_news_corpus", "prepare_corpora"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
